# Local parity for the k8s web pod: same image, read-only, keyless, mock backend.
# It never receives an Ember key or the spend ledger. It sees only:
#   - the structural index (read-only)
#   - the governor's public snapshot dir (status.json / telemetry.json, read-only)
# Run `make compose-up`; it creates the snapshot dir as you first, so Docker never creates it as root.
name: eddie

services:
  api:
    build: .
    image: eddie:dev
    user: "1000:1000"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      EDDIE_BACKEND: mock
    volumes:
      - type: bind
        source: ./data/index
        target: /data/index
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EDDIE_PUBLIC_DIR:-${HOME}/.local/share/eddie/public}
        target: /public
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
