# Host is a placeholder until DNS is decided on deploy night.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eddie
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - eddie.theclamlife.com
      secretName: eddie-tls
  rules:
    - host: eddie.theclamlife.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eddie-web
                port:
                  name: http
