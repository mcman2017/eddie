# Placeholder host. A `.local` name cannot get a public ACME certificate; for a real
# deployment add your issuer annotation and a tls block, e.g.:
#   metadata.annotations: {cert-manager.io/cluster-issuer: <your-issuer>}
#   spec.tls: [{hosts: [<your-host>], secretName: eddie-tls}]
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eddie
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: eddie.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eddie-web
                port:
                  name: http
