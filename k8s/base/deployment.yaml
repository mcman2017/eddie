# Keyless, read-only web/API pod. No Secret references by design: live Ember calls run
# only from the operator CLI on the DGX host, so nothing reachable from the internet can
# spend the contest budget.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eddie-web
  labels:
    app.kubernetes.io/name: eddie
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: eddie
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eddie
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch  # never chown 1.7 GB of data on every start
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/mcman2017/eddie:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: EDDIE_BACKEND
              value: mock
            # everything is read through the `current` release symlink (see pvc.yaml)
            - name: EDDIE_DATA_DIR
              value: /data/current
            - name: EDDIE_INDEX_PATH
              value: /data/current/index/eddie_index.sqlite
            - name: EDDIE_PUBLIC_DIR
              value: /data/current/public
            - name: EDDIE_MEDIA_DIR
              value: /data/current/media
            - name: EDDIE_DOCS
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi  # the page cache of a 1.7 GB data set counts against the limit
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: eddie-data
            readOnly: true
