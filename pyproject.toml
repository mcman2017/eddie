[project]
name = "eddie"
version = "0.1.0"
description = "Eddie: a 4-region autonomous proof decompiler for Lean 4, running on Meta Muse Ember under a hard spend governor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "mpmath>=1.3",
]

[project.scripts]
eddie = "eddie.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eddie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "slow: tests that spawn processes or take more than a second",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# CLI downloader: small local file/path operations inside async code are fine; hashing is threaded.
"eddie/ingest/fetch.py" = ["ASYNC230", "ASYNC240"]
